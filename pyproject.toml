[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# PTH (os.path -> pathlib) is deliberately left out: the remaining os.path use
# is in plots.py, where paths come from strftime templates as strings and are
# handed straight to os.listdir/fnmatch.
select = ["E", "F", "W", "I", "UP", "B", "A", "S", "RUF", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is the point

[tool.pytest.ini_options]
testpaths = ["tests"]
# The package sits at the repo root. pytest's default import mode only puts
# tests/ on sys.path, so the root has to be named here for `import igmk_api`.
pythonpath = ["."]
